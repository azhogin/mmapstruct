[package]
name = "mmapstruct-schema"
version.workspace = true
edition.workspace = true

[dependencies]
mmapstruct = { path = "../mmapstruct", features = ["dyn"] }
mmapstruct-derive = { path = "../mmapstruct-derive" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dyn"))'] }
