[package]
name = "mmapview"
version.workspace = true
edition.workspace = true

[dependencies]
mmapstruct = { path = "../mmapstruct", features = ["dyn"] }
mmapstruct-schema = { path = "../mmapstruct-schema" }
mmapstruct-schemagen = { path = "../mmapstruct-schemagen" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
serde_json = "1"
serde = { version = "1", features = ["derive"], optional = true }

[features]
json = ["serde"]

[[bin]]
name = "mmapview"
path = "src/main.rs"
