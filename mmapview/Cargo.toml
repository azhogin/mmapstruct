[package]
name = "mmapview"
version = "0.1.0"
edition = "2021"

[dependencies]
mmapstruct = { path = "../mmapstruct", features = ["dyn"] }
mmapstruct-schema = { path = "../mmapstruct-schema" }
mmapstruct-schemagen = { path = "../mmapstruct-schemagen" }
bytemuck = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
json = ["serde_json", "serde"]

[[bin]]
name = "mmapview"
path = "src/main.rs"
