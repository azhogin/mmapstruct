[package]
name = "mmapstruct"
version.workspace = true
edition.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
memmap2 = "0.9"
mmapstruct-derive = { path = "../mmapstruct-derive" }

[dev-dependencies]
tempfile = "3"
mmapstruct-schema = { path = "../mmapstruct-schema" }

[features]
default = []
safe-strings = []
strict-validation = ["safe-strings"]
dyn = ["mmapstruct-derive/dyn"]
# Fuzz-target functions (mmapstruct/src/fuzzing.rs): shared between the
# cargo-fuzz harnesses (fuzz/, nightly) and the stable corpus-replay test.
fuzzing = ["dyn"]

[lib]
proc-macro = false
