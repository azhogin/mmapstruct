[package]
name = "mmapstruct"
version.workspace = true
edition.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
mmapstruct-derive = { path = "../mmapstruct-derive" }

[dev-dependencies]
tempfile = "3"
mmapstruct-schema = { path = "../mmapstruct-schema" }

[features]
default = []
safe-strings = []
strict-validation = ["safe-strings"]
dyn = ["mmapstruct-derive/dyn"]

[lib]
proc-macro = false
