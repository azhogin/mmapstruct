[package]
name = "mmapview-tui"
version.workspace = true
edition.workspace = true

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
mmapstruct = { path = "../mmapstruct", features = ["dyn"] }
mmapstruct-schema = { path = "../mmapstruct-schema" }
mmapview = { path = "../mmapview" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[[bin]]
name = "mmapview-tui"
path = "src/main.rs"
