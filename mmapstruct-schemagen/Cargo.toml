[package]
name = "mmapstruct-schemagen"
version = "0.1.0"
edition = "2021"
description = "Generates the self-schema of Schema (self-schema.mms) at build time and exposes it as a constant."

[build-dependencies]
mmapstruct = { path = "../mmapstruct", features = ["dyn"] }
mmapstruct-schema = { path = "../mmapstruct-schema" }
